<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <div class="container p-3 display-flex justify-content-center">
        <div class="content table card p-5 w-75">
            <h2><u><i>TABLES NUMBERS</i></u></h2>
            <p>Type any numbers and any rang </p>

            <form action="" onsubmit="submitData(), event.preventDefault()">
            <input type="number" id="tablenumber" class="form-control m-2 p-2" placeholder="Enter your number" required>

            <input type="number" id="tablerange" class="form-control m-2 p-2" placeholder="Enter your number" required>
            <button class="btn btn-warning">submit</button>
            </form>
            <button class="btn btn-warning m-2">Reload</button>

            <div class="result card m-2 p-2" id="result">
                <p>nothing to show!</p>

            </div>

        </div>
    </div>
</body>
